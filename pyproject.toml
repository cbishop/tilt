[project]
name = "tilt"
version = "0.1.0"
description = "Does a slant spread when one model learns from another? Dose-response of framing transfer through distillation."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Clarke Bishop" }]
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "inspect-ai",
    "matplotlib",
    "mlx-lm",
    "numpy",
    "pandas",
    "pyyaml",
    "scikit-learn",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
tilt-recall = "tilt.recall:main"
tilt-generate = "tilt.generate:main"
tilt-train = "tilt.train:main"
tilt-evaluate = "tilt.evaluate:main"
tilt-judge = "tilt.judge:main"
tilt-probe = "tilt.probe:main"
tilt-plots = "tilt.plots:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
